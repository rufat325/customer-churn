name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The tests that need a model artifact skip when it is absent, so this
      # step is what makes the run meaningful rather than mostly skipped.
      - name: Generate data
        run: python src/generate_data.py

      - name: Train model
        run: python src/train.py

      - name: Run tests
        run: python -m pytest -v

      - name: Check the model card is valid JSON
        run: |
          python -c "import json; json.load(open('models/model_card.json'))"

      - name: Upload model card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-card
          path: models/model_card.json
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The image copies models/ at build time, so the artifact has to exist
      # before docker build runs.
      - name: Build the model artifact
        run: |
          pip install -r requirements-dev.txt
          python src/generate_data.py
          python src/train.py

      - name: Build image
        run: docker build -t customer-churn:ci .

      - name: Start container
        run: |
          docker run -d --name churn-api -p 8000:8000 customer-churn:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy"
          docker logs churn-api
          exit 1

      - name: Smoke test the endpoints
        run: |
          curl -fs http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"healthy"'
          curl -fs -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"age":35,"country":"DE","total_orders":2,"total_spent":150,
                 "days_since_last_order":75,"has_previous_order":1,
                 "total_events":5,"add_to_cart_count":1,"checkout_count":0,
                 "login_count":2,"product_view_count":2,"tenure_days":180,
                 "events_last_30_days":0}' | tee /dev/stderr | grep -q churn_probability

      - name: Container logs
        if: always()
        run: docker logs churn-api
